<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe — Online</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #eee;
    }

    .screen { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; }
    .hidden { display: none !important; }

    h1 { font-size: 2rem; letter-spacing: 0.1em; color: #e0e0ff; }
    .subtitle { font-size: 0.85rem; color: #666; letter-spacing: 0.2em; text-transform: uppercase; }

    /* ── Lobby ── */
    .lobby-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
      margin-top: 0.5rem;
      width: 260px;
    }

    .separator {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      width: 100%;
      color: #555;
      font-size: 0.85rem;
    }
    .separator::before, .separator::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #2d2d50;
    }

    #join-input {
      width: 100%;
      padding: 0.7rem 1rem;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.5em;
      text-align: center;
      text-transform: uppercase;
      background: #16213e;
      border: 2px solid #2a2a5a;
      border-radius: 8px;
      color: #e0e0ff;
      outline: none;
      transition: border-color 0.15s;
    }
    #join-input:focus { border-color: #7b61ff; }
    #join-input::placeholder { color: #333; letter-spacing: 0.2em; font-size: 1rem; font-weight: 400; }

    .error { color: #ff6b6b; font-size: 0.88rem; min-height: 1.1rem; text-align: center; }

    /* ── Buttons ── */
    .btn {
      width: 100%;
      padding: 0.65rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: #7b61ff; color: #fff; }
    .btn-primary:not(:disabled):hover { background: #9b80ff; }
    .btn-secondary { background: #1e2050; color: #bbb; }
    .btn-secondary:not(:disabled):hover { background: #2a2a70; }

    /* ── Game meta bar ── */
    #game-meta {
      display: flex;
      gap: 1.5rem;
      font-size: 0.85rem;
      color: #666;
      letter-spacing: 0.04em;
      align-items: center;
    }
    #game-meta .val { color: #a0c4ff; font-weight: 700; }
    #symbol-display.x { color: #ff6b6b; }
    #symbol-display.o { color: #4ecdc4; }

    #copy-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #555;
      font-size: 0.95rem;
      padding: 0 0.25rem;
      vertical-align: middle;
      transition: color 0.15s;
    }
    #copy-btn:hover { color: #9b80ff; }

    /* ── Status ── */
    #status {
      font-size: 1.1rem;
      min-height: 1.7rem;
      color: #a0c4ff;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-align: center;
    }

    /* ── Board ── */
    #board {
      display: grid;
      grid-template-columns: repeat(6, 75px);
      grid-template-rows: repeat(6, 75px);
      gap: 6px;
    }

    .cell {
      width: 75px;
      height: 75px;
      background: #16213e;
      border: 2px solid #2a2a5a;
      border-radius: 8px;
      font-size: 2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
      user-select: none;
      transition: background 0.15s, transform 0.1s;
    }
    .cell.clickable { cursor: pointer; }
    .cell.clickable:hover { background: #1e2d5a; transform: scale(1.04); }
    .cell.x { color: #ff6b6b; }
    .cell.o { color: #4ecdc4; }
    .cell.win { background: #2a1e5a; border-color: #7b61ff; animation: pulse 0.45s ease; }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.09); }
      100% { transform: scale(1); }
    }

    /* ── Game buttons ── */
    .game-buttons { display: flex; gap: 0.7rem; width: 480px; }
    .game-buttons .btn { width: auto; flex: 1; }

    /* ── Endgame canvas effects ── */
    #ending-effects-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.28s ease;
    }
    #ending-effects-canvas.active { opacity: 1; }
  </style>
</head>
<body>

<!-- ══ LOBBY ══ -->
<div id="screen-lobby" class="screen">
  <h1>Tic Tac Toe</h1>
  <p class="subtitle">Online Multiplayer</p>
  <div class="lobby-body">
    <button class="btn btn-primary" id="btn-create">Create Game</button>
    <div class="separator">or</div>
    <input id="join-input" type="text" placeholder="CODE OR LINK"
           autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="btn btn-secondary" id="btn-join">Join Game</button>
    <p class="error" id="lobby-error"></p>
  </div>
</div>

<!-- ══ GAME ══ -->
<div id="screen-game" class="screen hidden">
  <h1>Tic Tac Toe</h1>
  <div id="game-meta">
    Room: <span class="val" id="code-display">—</span>
    <button id="copy-btn" title="Copy invite link">⧉</button>
    &nbsp;|&nbsp;
    You are: <span class="val" id="symbol-display">—</span>
  </div>
  <div id="status">Loading…</div>
  <div id="board"></div>
  <div class="game-buttons">
    <button class="btn btn-primary  hidden" id="btn-rematch">Rematch</button>
    <button class="btn btn-secondary" id="btn-leave">Leave</button>
  </div>
</div>

<canvas id="ending-effects-canvas" aria-hidden="true"></canvas>

<script type="module">
  // NOTE: Make sure Firestore is enabled in your Firebase console and your
  // security rules allow reads/writes (test mode is fine for development).

  import { initializeApp }
    from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
  import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot }
    from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

  const firebaseConfig = {
    apiKey:            "AIzaSyBQL5uu_4YmRZolx2fOL_0UwQ9L1kwgkaY",
    authDomain:        "tic-tac-toe-138c5.firebaseapp.com",
    projectId:         "tic-tac-toe-138c5",
    storageBucket:     "tic-tac-toe-138c5.firebasestorage.app",
    messagingSenderId: "1054673771679",
    appId:             "1:1054673771679:web:9e5e04bf5890e50c3f96aa"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  const WIN_LINES = (() => {
    const SIZE = 6, STREAK = 4, lines = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const seq = (dr, dc) => Array.from({ length: STREAK }, (_, k) => (r + k * dr) * SIZE + c + k * dc);
        if (c + STREAK <= SIZE)                       lines.push(seq(0,  1)); // horizontal
        if (r + STREAK <= SIZE)                       lines.push(seq(1,  0)); // vertical
        if (r + STREAK <= SIZE && c + STREAK <= SIZE) lines.push(seq(1,  1)); // diagonal ↘
        if (r + STREAK <= SIZE && c - STREAK >= -1)   lines.push(seq(1, -1)); // diagonal ↙
      }
    }
    return lines;
  })();

  // ── State ──────────────────────────────────────────────
  let mySymbol  = null;   // 'X' | 'O'
  let roomCode  = null;
  let unsubscribe = null;
  let gameData  = null;
  let lastEndingEffectKey = null;
  let endingEffectsController = null;

  // ── Element refs ───────────────────────────────────────
  const $lobby      = document.getElementById('screen-lobby');
  const $game       = document.getElementById('screen-game');
  const $lobbyErr   = document.getElementById('lobby-error');
  const $codeDisp   = document.getElementById('code-display');
  const $symbolDisp = document.getElementById('symbol-display');
  const $status     = document.getElementById('status');
  const $board      = document.getElementById('board');
  const $btnRematch = document.getElementById('btn-rematch');
  const $joinInput  = document.getElementById('join-input');
  const $btnCreate  = document.getElementById('btn-create');
  const $btnJoin    = document.getElementById('btn-join');
  const $endingCanvas = document.getElementById('ending-effects-canvas');

  // ── Lobby events ───────────────────────────────────────
  $joinInput.addEventListener('input', () => {
    $lobbyErr.textContent = '';
  });

  $btnCreate.addEventListener('click', createGame);

  $btnJoin.addEventListener('click', () => {
    const rawJoinValue = $joinInput.value.trim();
    const code = extractRoomCode(rawJoinValue);
    if (code.length !== 4) { $lobbyErr.textContent = 'Enter a 4-letter room code.'; return; }
    joinGame(code);
  });

  document.getElementById('btn-rematch').addEventListener('click', requestRematch);
  document.getElementById('btn-leave').addEventListener('click', leave);
  document.getElementById('copy-btn').addEventListener('click', () => {
    navigator.clipboard.writeText(buildInviteUrl(roomCode)).catch(() => {});
  });

  handleInviteLink();

  // ── Create a new game room ─────────────────────────────
  async function createGame() {
    setLobbyBusy(true);

    let code = null;
    for (let i = 0; i < 10; i++) {
      const candidate = randomCode();
      const snap = await getDoc(doc(db, 'rooms', candidate)).catch(() => null);
      if (snap && !snap.exists()) { code = candidate; break; }
    }
    if (!code) {
      $lobbyErr.textContent = 'Could not create a room. Try again.';
      setLobbyBusy(false);
      return;
    }

    roomCode = code;
    mySymbol = 'X';

    await setDoc(doc(db, 'rooms', code), {
      board:       Array(36).fill(''),
      currentTurn: 'X',
      xJoined:     true,
      oJoined:     false,
      winner:      null,
      status:      'waiting',
      rematchRequests: { X: false, O: false },
      nextFirstPlayer: 'O',
      gameNumber: 1
    });

    setLobbyBusy(false);
    showGameScreen();
    subscribeToRoom(code);
  }

  // ── Join an existing room ──────────────────────────────
  async function joinGame(code) {
    setLobbyBusy(true);

    const ref  = doc(db, 'rooms', code);
    const snap = await getDoc(ref).catch(() => null);

    if (!snap) {
      $lobbyErr.textContent = 'Connection error. Check your internet and try again.';
      setLobbyBusy(false);
      return;
    }
    if (!snap.exists()) {
      $lobbyErr.textContent = `Room "${code}" not found. Check the code and try again.`;
      setLobbyBusy(false);
      return;
    }

    const data = snap.data();
    if (data.oJoined) {
      $lobbyErr.textContent = 'This room is already full.';
      setLobbyBusy(false);
      return;
    }

    roomCode = code;
    mySymbol = 'O';

    await updateDoc(ref, { oJoined: true, status: 'playing' });

    setLobbyBusy(false);
    showGameScreen();
    subscribeToRoom(code);
  }

  // ── Firestore real-time listener ───────────────────────
  function subscribeToRoom(code) {
    unsubscribe = onSnapshot(doc(db, 'rooms', code), snap => {
      if (!snap.exists()) return;
      gameData = snap.data();
      renderGame(gameData);
    });
  }

  // ── Render the current game state ──────────────────────
  function renderGame(data) {
    const waiting    = !data.oJoined;
    const finished   = data.status === 'finished';
    const myTurn     = !waiting && !finished && data.currentTurn === mySymbol;

    if (!finished) lastEndingEffectKey = null;

    // Status line
    if (waiting) {
      $status.textContent = `Room ${roomCode} — waiting for opponent to join…`;
    } else if (finished) {
      if      (data.winner === 'draw')     $status.textContent = "It's a draw!";
      else if (data.winner === mySymbol)   $status.textContent = 'You win!';
      else                                 $status.textContent = 'Opponent wins!';
    } else {
      $status.textContent = myTurn ? `Your turn (${mySymbol})` : `Opponent's turn…`;
    }

    $btnRematch.classList.toggle('hidden', !finished);
    if (finished) {
      const requests = data.rematchRequests || {};
      $btnRematch.disabled = !!requests[mySymbol];
      $btnRematch.textContent = requests[mySymbol] ? 'Waiting for opponent…' : 'Play Again';
    } else {
      $btnRematch.disabled = false;
      $btnRematch.textContent = 'Play Again';
    }

    const winLine = finished ? findWinLine(data.board) : null;
    renderBoard(data.board, winLine, myTurn);
    maybePlayEndingEffect(data);
  }

  function renderBoard(board, winLine, myTurn) {
    $board.innerHTML = '';
    board.forEach((val, i) => {
      const cell = document.createElement('div');
      const winning = winLine && winLine.includes(i);
      cell.className = [
        'cell',
        val ? val.toLowerCase() : '',
        winning ? 'win' : '',
        (!val && myTurn) ? 'clickable' : ''
      ].filter(Boolean).join(' ');
      cell.textContent = val;
      if (!val && myTurn) cell.addEventListener('click', () => handleMove(i));
      $board.appendChild(cell);
    });
  }

  // ── Make a move ────────────────────────────────────────
  async function handleMove(index) {
    if (!gameData)                              return;
    if (gameData.currentTurn !== mySymbol)      return;
    if (gameData.board[index] !== '')           return;
    if (gameData.status !== 'playing')          return;

    const newBoard = [...gameData.board];
    newBoard[index] = mySymbol;

    const winner = checkWinner(newBoard);
    const isDraw = !winner && newBoard.every(v => v !== '');

    const updates = {
      board:       newBoard,
      currentTurn: mySymbol === 'X' ? 'O' : 'X'
    };
    if (winner) { updates.winner = winner; updates.status = 'finished'; }
    else if (isDraw) { updates.winner = 'draw'; updates.status = 'finished'; }

    await updateDoc(doc(db, 'rooms', roomCode), updates);
  }

  // ── Rematch: both players request; first player alternates ─────────
  async function requestRematch() {
    if (!roomCode || !mySymbol) return;

    const ref = doc(db, 'rooms', roomCode);
    const snap = await getDoc(ref).catch(() => null);
    if (!snap || !snap.exists()) return;

    const data = snap.data();
    const nextFirstPlayer = data.nextFirstPlayer || 'O';
    const rematchRequests = { ...(data.rematchRequests || {}), [mySymbol]: true };

    if (rematchRequests[otherSymbol(mySymbol)]) {
      await updateDoc(ref, {
        board:       Array(36).fill(''),
        currentTurn: nextFirstPlayer,
        winner:      null,
        status:      'playing',
        rematchRequests: { X: false, O: false },
        nextFirstPlayer: otherSymbol(nextFirstPlayer),
        gameNumber: (data.gameNumber || 1) + 1
      });
    } else {
      await updateDoc(ref, { rematchRequests });
    }
  }

  // ── Leave: back to lobby ───────────────────────────────
  function leave() {
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    mySymbol = roomCode = gameData = null;
    $joinInput.value = '';
    $lobbyErr.textContent = '';
    $game.classList.add('hidden');
    $lobby.classList.remove('hidden');
  }

  function maybePlayEndingEffect(data) {
    if (!data || data.status !== 'finished' || !data.winner) return;
    const effectKey = `${roomCode}:${data.gameNumber || 1}:${data.winner}:${data.board.join('')}`;
    if (effectKey === lastEndingEffectKey) return;
    lastEndingEffectKey = effectKey;
    const effect = data.winner === 'draw' ? 'tie' : data.winner === mySymbol ? 'winner' : 'loser';
    playEndingEffect(effect);
  }

  function playEndingEffect(effect) {
    if (!endingEffectsController) endingEffectsController = new EndingEffectsController($endingCanvas);
    if (effect === 'winner') endingEffectsController.playEndingEffect('winner');
    else if (effect === 'loser') endingEffectsController.playEndingEffect('loser');
    else if (effect === 'tie') endingEffectsController.playEndingEffect('tie');
  }

  // ── Helpers ────────────────────────────────────────────
  function randomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    return Array.from({ length: 4 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
  }

  function otherSymbol(symbol) {
    return symbol === 'X' ? 'O' : 'X';
  }

  function checkWinner(board) {
    for (const line of WIN_LINES) {
      const first = board[line[0]];
      if (first && line.every(i => board[i] === first)) return first;
    }
    return null;
  }

  function findWinLine(board) {
    return WIN_LINES.find(line => {
      const first = board[line[0]];
      return first && line.every(i => board[i] === first);
    }) ?? null;
  }

  function showGameScreen() {
    $codeDisp.textContent = roomCode;
    $symbolDisp.textContent = mySymbol;
    $symbolDisp.className = mySymbol === 'X' ? 'val x' : 'val o';
    $lobby.classList.add('hidden');
    $game.classList.remove('hidden');
  }

  function setLobbyBusy(busy) {
    $btnCreate.disabled = busy;
    $btnJoin.disabled   = busy;
  }

  function handleInviteLink() {
    const params = new URLSearchParams(window.location.search);
    const inviteCode = extractRoomCode(params.get('room') || params.get('code') || params.get('join') || '');
    if (inviteCode.length !== 4) return;

    $joinInput.value = inviteCode;
    joinGame(inviteCode);
  }

  function buildInviteUrl(code) {
    const url = new URL(window.location.href);
    url.searchParams.set('room', code);
    return url.toString();
  }

  function extractRoomCode(raw) {
    const value = String(raw || '').trim();
    if (!value) return '';

    try {
      const parsed = new URL(value, window.location.href);
      const fromUrl = parsed.searchParams.get('room') || parsed.searchParams.get('code') || parsed.searchParams.get('join');
      if (fromUrl) return normalizeRoomCode(fromUrl);
    } catch (_) {}

    return normalizeRoomCode(value);
  }

  function normalizeRoomCode(value) {
    return String(value || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  }


  // ── Endgame animation effects ──────────────────────────
  class EndingParticle {
    constructor(opts) { Object.assign(this, opts); this.age = 0; this.dead = false; this.trail = []; }
    update(dt) {
      this.age += dt; if (this.age >= this.life) this.dead = true;
      this.trail.push([this.x, this.y]); if (this.trail.length > (this.trailLength || 8)) this.trail.shift();
      this.vx += (this.ax || 0) * dt; this.vy += (this.ay || 0) * dt;
      this.x += this.vx * dt; this.y += this.vy * dt;
      const drag = Math.pow(this.drag || 0.99, dt * 60); this.vx *= drag; this.vy *= drag;
    }
    draw(ctx) {
      const t = Math.min(1, this.age / this.life);
      const alpha = Math.max(0, Math.pow(1 - t, this.fadePower || 1.4)) * (this.alpha || 1);
      if (alpha <= 0) return;
      ctx.save(); ctx.globalCompositeOperation = this.blend || 'screen'; ctx.lineCap = 'round';
      if (this.trail.length > 1) {
        for (let i = 1; i < this.trail.length; i++) {
          ctx.strokeStyle = endingRgba(this.color, alpha * (i / this.trail.length) * 0.44);
          ctx.lineWidth = Math.max(0.5, (this.size || 2) * i / this.trail.length);
          ctx.beginPath(); ctx.moveTo(this.trail[i - 1][0], this.trail[i - 1][1]); ctx.lineTo(this.trail[i][0], this.trail[i][1]); ctx.stroke();
        }
      }
      const r = Math.max(0.5, (this.size || 2) * (this.grow ? 0.45 + t * this.grow : 1));
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r * 5);
      g.addColorStop(0, endingRgba(this.hot || '#ffffff', alpha));
      g.addColorStop(0.22, endingRgba(this.color, alpha * 0.82));
      g.addColorStop(1, endingRgba(this.color, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(this.x, this.y, r * 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = endingRgba(this.hot || this.color, alpha); ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  class EndingWave {
    constructor(x, y, color, maxR, life, width = 5) { Object.assign(this, {x, y, color, maxR, life, width, age: 0, dead: false}); }
    update(dt) { this.age += dt; if (this.age >= this.life) this.dead = true; }
    draw(ctx) {
      const t = Math.min(1, this.age / this.life), ease = 1 - Math.pow(1 - t, 3);
      ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.strokeStyle = endingRgba(this.color, (1 - t) * 0.82);
      ctx.lineWidth = this.width * (1 - t) + 1; ctx.beginPath(); ctx.arc(this.x, this.y, this.maxR * ease, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
  }

  class WinnerFireworksEffect {
    constructor(controller) { this.c = controller; this.nextBurstAt = 0; }
    start() { for (let i = 0; i < 6; i++) setTimeout(() => this.burst(endingRand(0.18, 0.82), endingRand(0.14, 0.46), endingRand(0.8, 1.3)), i * 190); }
    update(t) { if (t > this.nextBurstAt && t < 4.2) { this.nextBurstAt = t + endingRand(0.34, 0.62); this.burst(endingRand(0.15, 0.85), endingRand(0.14, 0.52), endingRand(0.8, 1.35)); } }
    burst(px, py, scale) {
      const c = this.c, x = c.W * px, y = c.H * py, color = endingChoice(['#7b61ff', '#4ecdc4', '#ffd166', '#ff6b9d', '#a0c4ff']);
      c.waves.push(new EndingWave(x, y, color, 76 * scale, 0.78, 4));
      const count = Math.floor(56 * scale);
      for (let i = 0; i < count; i++) {
        const a = Math.PI * 2 * i / count + endingRand(-0.04, 0.04), speed = endingRand(85, 240) * scale;
        c.particles.push(new EndingParticle({x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, ay: 98, drag: 0.986, life: endingRand(1.0, 1.85), size: endingRand(1.1, 2.8) * scale, color, hot: '#fff', trailLength: 12}));
      }
    }
  }

  class LoserExplosionEffect {
    constructor(controller) { this.c = controller; }
    start() {
      const c = this.c, x = c.W * 0.5, y = c.H * 0.62;
      c.waves.push(new EndingWave(x, y, '#fff2a6', Math.min(c.W, c.H) * 0.46, 1.1, 9));
      c.waves.push(new EndingWave(x, y, '#ff6b2e', Math.min(c.W, c.H) * 0.72, 1.55, 5));
      for (let i = 0; i < 170; i++) {
        const a = endingRand(0, Math.PI * 2), speed = endingRand(80, 330), up = endingRand(20, 135);
        c.particles.push(new EndingParticle({x: x + endingRand(-16, 16), y: y + endingRand(-8, 12), vx: Math.cos(a) * speed, vy: Math.sin(a) * speed * 0.55 - up, ay: endingRand(20, 110), drag: 0.955, life: endingRand(0.85, 2.5), size: endingRand(3, 10), grow: endingRand(0.4, 1.4), color: endingChoice(['#fff3b0', '#ffcf56', '#ff8a3d', '#ff4d2e', '#6b7280']), hot: '#fff7d2', trailLength: 5});
      }
    }
    update(t) {
      const c = this.c, x = c.W * 0.5, y = c.H * 0.46;
      if (t < 3.0 && Math.random() < 0.34) c.particles.push(new EndingParticle({x: x + endingRand(-130, 130), y: y + endingRand(-40, 150), vx: endingRand(-18, 18), vy: endingRand(-32, 10), ay: -18, drag: 0.99, life: endingRand(2.2, 4.4), size: endingRand(8, 22), grow: endingRand(1.0, 2.2), color: endingChoice(['#596070', '#81858f', '#34384b']), hot: '#ff9b3d', blend: 'source-over', alpha: 0.48, trailLength: 1}));
    }
  }

  class TieCosmicStalemateEffect {
    constructor(controller) { this.c = controller; }
    start() {
      const c = this.c, x = c.W * 0.5, y = c.H * 0.43;
      c.waves.push(new EndingWave(x, y, '#69e7ff', Math.min(c.W, c.H) * 0.42, 1.35, 5));
      c.waves.push(new EndingWave(x, y, '#b39cff', Math.min(c.W, c.H) * 0.58, 2.1, 3));
      for (let i = 0; i < 110; i++) this.stardust();
    }
    stardust() {
      const c = this.c, a = endingRand(0, Math.PI * 2), r = endingRand(18, Math.min(c.W, c.H) * 0.32);
      c.particles.push(new EndingParticle({x: c.W * 0.5 + Math.cos(a) * r, y: c.H * 0.43 + Math.sin(a) * r * 0.7, vx: -Math.sin(a) * endingRand(12, 46), vy: Math.cos(a) * endingRand(10, 34), ay: endingRand(-8, 8), drag: 0.992, life: endingRand(1.8, 3.8), size: endingRand(0.8, 2.4), color: endingChoice(['#69e7ff', '#b39cff', '#f7d3ff', '#d8fff8']), hot: '#fff', trailLength: 9, alpha: 0.82}));
    }
    update(t) {
      const c = this.c, ctx = c.ctx, cx = c.W * 0.5, cy = c.H * 0.43;
      const progress = Math.min(1, t / 2.65), ease = 1 - Math.pow(1 - progress, 3), orbit = Math.max(42, Math.min(c.W, c.H) * (0.29 - ease * 0.14));
      const angle = t * (2.8 + ease * 3.4);
      this.symbol('X', cx + Math.cos(angle) * orbit, cy + Math.sin(angle) * orbit * 0.44, '#69e7ff', 50 + ease * 16, angle);
      this.symbol('O', cx + Math.cos(angle + Math.PI) * orbit, cy + Math.sin(angle + Math.PI) * orbit * 0.44, '#f7d3ff', 50 + ease * 16, -angle * 0.7);
      if (t > 2.1) this.emblem(Math.min(1, (t - 2.1) / 1.1));
      if (t > 2.75) this.text(Math.min(1, (t - 2.75) / 0.9));
      if (t < 3.1 && Math.random() < 0.18) this.stardust();
    }
    symbol(symbol, x, y, color, size, rot) { const ctx = this.c.ctx; ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.translate(x, y); ctx.rotate(rot); ctx.font = `950 ${size}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.shadowColor = color; ctx.shadowBlur = 24; ctx.fillStyle = endingRgba(color, 0.92); ctx.fillText(symbol, 0, 0); ctx.restore(); }
    emblem(alpha) { const c = this.c, ctx = c.ctx, cx = c.W * 0.5, cy = c.H * 0.43, r = Math.min(c.W, c.H) * 0.11; ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = alpha; const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2.4); g.addColorStop(0, 'rgba(255,255,255,0.48)'); g.addColorStop(0.3, 'rgba(105,231,255,0.32)'); g.addColorStop(1, 'rgba(105,231,255,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r * 2.4, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
    text(alpha) { const c = this.c, ctx = c.ctx; ctx.save(); ctx.globalAlpha = alpha; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.shadowColor = '#69e7ff'; ctx.shadowBlur = 20; ctx.font = `900 ${Math.max(28, Math.min(c.W, c.H) * 0.065)}px system-ui`; ctx.fillStyle = '#f3f0ff'; ctx.fillText('Cosmic Stalemate', c.W * 0.5, c.H * 0.68); ctx.font = `800 ${Math.max(14, Math.min(c.W, c.H) * 0.026)}px system-ui`; ctx.fillStyle = '#d8fff8'; ctx.fillText('Perfectly matched', c.W * 0.5, c.H * 0.74); ctx.restore(); }
  }

  class EndingEffectsController {
    constructor(canvas) { this.canvas = canvas; this.ctx = canvas.getContext('2d'); this.W = 1; this.H = 1; this.dpr = 1; this.particles = []; this.waves = []; this.effect = null; this.startedAt = 0; this.previous = 0; this.raf = null; this.resize(); window.addEventListener('resize', () => this.resize()); }
    resize() { this.dpr = Math.min(window.devicePixelRatio || 1, 2); this.W = window.innerWidth; this.H = window.innerHeight; this.canvas.width = Math.floor(this.W * this.dpr); this.canvas.height = Math.floor(this.H * this.dpr); this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0); }
    playEndingEffect(effect) { this.resize(); this.canvas.classList.add('active'); this.particles = []; this.waves = []; this.startedAt = performance.now(); this.previous = this.startedAt; this.effect = effect === 'winner' ? new WinnerFireworksEffect(this) : effect === 'loser' ? new LoserExplosionEffect(this) : new TieCosmicStalemateEffect(this); this.effect.start(); if (!this.raf) this.raf = requestAnimationFrame(now => this.animate(now)); setTimeout(() => this.canvas.classList.remove('active'), 5200); }
    animate(now) { const dt = Math.min(0.033, Math.max(0.001, (now - this.previous) / 1000 || 0.016)); this.previous = now; const elapsed = Math.max(0, (now - this.startedAt) / 1000); this.ctx.clearRect(0, 0, this.W, this.H); if (this.effect && elapsed < 5.4) this.effect.update(elapsed); for (const w of this.waves) { w.update(dt); w.draw(this.ctx); } this.waves = this.waves.filter(w => !w.dead); for (const p of this.particles) { p.update(dt); p.draw(this.ctx); } this.particles = this.particles.filter(p => !p.dead && p.x > -180 && p.x < this.W + 180 && p.y > -180 && p.y < this.H + 220); if (elapsed > 5.6 && !this.particles.length && !this.waves.length) { this.raf = null; this.ctx.clearRect(0, 0, this.W, this.H); return; } this.raf = requestAnimationFrame(t => this.animate(t)); }
  }

  function endingRgba(hex, alpha) { const c = hex.replace('#', ''); const n = parseInt(c.length === 3 ? c.split('').map(x => x + x).join('') : c, 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${Math.max(0, Math.min(1, alpha))})`; }
  function endingRand(min, max) { return Math.random() * (max - min) + min; }
  function endingChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  window.__playEndingEffectForTest = playEndingEffect;

</script>
